function useRuta(){
  const leer=()=>{const r=location.hash.replace("#/","");return ORDEN.includes(r)?r:"inicio"};
  const [r,setR]=useState(leer);
  useEffect(()=>{const f=()=>{setR(leer());window.scrollTo(0,0)};addEventListener("hashchange",f);return()=>removeEventListener("hashchange",f)},[]);
  return r;
}
const L=({to,className,children,...p})=><a href={"#/"+to} className={className} {...p}>{children}</a>;

const quieto=()=>typeof matchMedia!=="undefined"&&matchMedia("(prefers-reduced-motion:reduce)").matches;

/* Aparición suave al entrar en pantalla */
function Rev({children,delay=0,as="div",className="",style,...p}){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    if(quieto()){el.classList.add("vis");return}
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("vis");io.disconnect()}},{threshold:.05,rootMargin:"0px 0px -5% 0px"});
    io.observe(el);return()=>io.disconnect();
  },[]);
  const T=as;
  return <T ref={ref} className={"rev "+className} style={{transitionDelay:delay+"ms",...style}} {...p}>{children}</T>;
}

/* Contador animado */
function Num({v,dec=0,suf=""}){
  const [n,setN]=useState(quieto()?v:0);
  useEffect(()=>{
    if(quieto()){setN(v);return}
    let r,ini;
    const f=t=>{if(!ini)ini=t;const k=Math.min(1,(t-ini)/850);setN(v*(1-Math.pow(1-k,3)));if(k<1)r=requestAnimationFrame(f)};
    r=requestAnimationFrame(f);return()=>cancelAnimationFrame(r);
  },[v]);
  return <>{n.toFixed(dec)}{suf}</>;
}
const Kpi=({v,dec=0,suf="",e,nota})=><div className="kpi"><b><Num v={v} dec={dec} suf={suf}/></b><small>{e}</small>{nota&&<em>{nota}</em>}</div>;
const Barras=({datos,max})=>{
  const m=max||Math.max(...datos.map(d=>d.v),1);
  return <div className="barras">{datos.map((d,i)=><div className="fila-b" key={d.n+"-"+i}>
    <span>{d.n}</span><div className="pista"><i className={d.c||""} style={{width:(d.v/m*100)+"%"}}/></div><b>{d.t!=null?d.t:d.v}</b></div>)}</div>;
};
function Progreso(){
  const ref=useRef(null);
  useEffect(()=>{
    let pend=false;
    const act=()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;if(ref.current)ref.current.style.transform="scaleX("+(m>0?h.scrollTop/m:0)+")";pend=false};
    const ped=()=>{if(!pend){pend=true;requestAnimationFrame(act)}};
    addEventListener("scroll",ped,{passive:true});addEventListener("resize",ped);act();
    return()=>{removeEventListener("scroll",ped);removeEventListener("resize",ped)};
  },[]);
  return <div className="progreso" ref={ref} aria-hidden="true"/>;
}

/* ===== Portada: cinta ondulada ===== */
function Cinta(){
  const ref=useRef();
  useEffect(()=>{
    const c=ref.current,x=c.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);
    let w,h,raf,t=0,mx=.5,suave=.5;
    const aj=()=>{w=c.offsetWidth;h=c.offsetHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0)};
    aj();addEventListener("resize",aj);
    const mv=e=>{mx=e.clientX/innerWidth};addEventListener("mousemove",mv);
    const cols=[["#FF3B3B","#FF9B8A"],["#0563B5","#7FB6EA"],["#A8A8A8","#E0E0E2"],["#B0B0B2","#0563B5"],["#7FB6EA","#0563B5"],["#FF3B3B","#B0B0B2"]];
    const y=(u,k,o)=>{const e=Math.sin(Math.PI*u);return h*.52+Math.sin(u*7+t+k*.7+o)*h*.16*e+Math.sin(u*3-t*.7+k)*h*.07*e};
    const dibuja=()=>{
      x.clearRect(0,0,w,h);suave+=(mx-suave)*.045;t+=.01+suave*.022;
      cols.forEach((cc,k)=>{
        const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,cc[0]);g.addColorStop(1,cc[1]);
        x.fillStyle=g;x.globalAlpha=.8;x.beginPath();const N=60;
        for(let i=0;i<=N;i++){const u=i/N;const py=y(u,k,0)-k*5;i?x.lineTo(u*w*.95,py):x.moveTo(u*w*.95,py)}
        for(let i=N;i>=0;i--){const u=i/N;x.lineTo(u*w*.95,y(u,k,.5)+Math.sin(Math.PI*u)*h*.07+k*5)}
        x.closePath();x.fill();
      });
      x.globalAlpha=1;if(!quieto())raf=requestAnimationFrame(dibuja);
    };
    dibuja();
    return()=>{cancelAnimationFrame(raf);removeEventListener("resize",aj);removeEventListener("mousemove",mv)};
  },[]);
  return <canvas ref={ref} className="cinta" aria-hidden="true"/>;
}

/* ===== Flujo de viento (canvas) ===== */
function Viento({vel}){
  const ref=useRef(),v=useRef(vel);v.current=vel;
  useEffect(()=>{
    const c=ref.current,x=c.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);
    let w,h,ps,raf,t=0,ultimo=0,visible=true;
    const aj=()=>{w=c.offsetWidth;h=c.offsetHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);
      ps=Array.from({length:150},()=>({x:Math.random()*w,y:Math.random()*h,o:Math.random()*6}))};
    aj();addEventListener("resize",aj);
    const io=new IntersectionObserver(([e])=>{visible=e.isIntersecting},{threshold:.01});
    io.observe(c);
    const f=ts=>{
      const dt=Math.min(2.5,(ts-(ultimo||ts))/16.7);ultimo=ts;t+=.02*dt;
      if(visible){
        const s=v.current;
        x.fillStyle="rgba(0,2,15,.22)";x.fillRect(0,0,w,h);
        x.fillStyle="#FF3B3B";x.beginPath();x.arc(50,h/2,9+Math.sin(t*4)*2,0,7);x.fill();
        ps.forEach(p=>{p.x+=dt*(.3+s*.6);p.y+=Math.sin(t+p.o)*(.3+s*.15)+(h/2-p.y)*.002*s;
          if(p.x>w){p.x=50;p.y=h/2+(Math.random()-.5)*30}
          const k=Math.max(0,1-(p.x-50)/w);x.fillStyle=k>.6?"#FF3B3B":"#2A86DA";x.globalAlpha=.4+k*.5;x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill();x.globalAlpha=1});
      }
      raf=requestAnimationFrame(f);
    };
    if(quieto()){const s=v.current;x.fillStyle="#00020F";x.fillRect(0,0,w,h);return()=>{io.disconnect();removeEventListener("resize",aj)}}
    raf=requestAnimationFrame(f);
    return()=>{cancelAnimationFrame(raf);io.disconnect();removeEventListener("resize",aj)};
  },[]);
  return <canvas ref={ref} className="viento" aria-label="Simulación del flujo de aire"/>;
}

function Prototipos(){

      <Kpi v={totalPub} e="Publicaciones"/>
      <Kpi v={totalDoc} e="Documentos"/>
      <Kpi v={pub/totalDoc*100} suf="%" e="Publicados"/>
      <Kpi v={totalDoc-pub} e="En proceso"/>
    </div>
    <div className="card"><h3>Publicaciones por año</h3>
      <div className="vbarras">{PUBLICACIONES.map(([y,n])=><div className="vb" key={y}>
        <div className="vcol"><i style={{height:(n/maxPub*100)+"%"}}/></div>
        <b>{n}</b><small>{y}</small></div>)}</div>
    </div>
    <div className="grid dos"><div className="card"><h3>Estado de documentos</h3>
      <Barras datos={DOC_EST.map(([n,v],i)=>({n,v,c:i===0?"":i===1?"rojo":"gris"}))}/></div>
      <div className="card"><h3>Tipo de documento</h3>
      <Barras datos={DOC_TIPO.map(([n,v])=>({n,v}))}/></div></div>
    <p className="nota">Refleja el volumen de publications y los campos status y doc_type de documents.</p>
  </div>;
}

/* ===== Reproductor de YouTube (IFrame Player API) ===== */
let ytPromesa=null;
function cargarYT(){
  if(ytPromesa)return ytPromesa;
  ytPromesa=new Promise(res=>{
    if(window.YT&&window.YT.Player)return res();
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{typeof prev==="function"&&prev();res()};
    const s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.async=true;
    s.onerror=()=>res();document.head.appendChild(s);
  });
  return ytPromesa;
}
function Video({v,activo,onPlay,onCerrar}){
  const host=useRef(null),pl=useRef(null);
  useEffect(()=>{
    if(!activo)return;
    let vivo=true;
    cargarYT().then(()=>{
      if(!vivo||!host.current||!window.YT||!window.YT.Player)return;
      host.current.innerHTML="";
      const d=document.createElement("div");host.current.appendChild(d);
      pl.current=new window.YT.Player(d,{videoId:v.id,playerVars:{autoplay:1,rel:0,modestbranding:1,playsinline:1},
        events:{onReady:e=>{if(vivo)e.target.playVideo()}}});
    }).catch(()=>{});
    return()=>{vivo=false;try{pl.current&&pl.current.destroy()}catch(e){}pl.current=null};
  },[activo,v.id]);
  return <article className={"video"+(activo?" on":"")}>
    <div className="marco">
      {activo?<div className="yt" ref={host}/>:
        <button className="poster" onClick={onPlay} aria-label={"Reproducir: "+v.t}>
          <img src={"https://i.ytimg.com/vi/"+v.id+"/hqdefault.jpg"} alt="" loading="lazy" onError={e=>{e.currentTarget.style.visibility="hidden"}}/>
          <span className="play" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg></span>
          <span className="eti">YouTube</span>
        </button>}
    </div>
    <div className="video-pie"><h4>{v.t}</h4><small>{v.c}</small>
      {activo?<button className="cerrar-v" onClick={onCerrar}>Cerrar reproductor</button>
        :<a className="abrir" href={"https://www.youtube.com/watch?v="+v.id} target="_blank" rel="noreferrer">Ver en YouTube ↗</a>}
    </div>
  </article>;
}
function VideoGrid({lista}){
  const [act,setAct]=useState(null);
  return <div className="videos">{lista.map((v,i)=><Rev key={v.id} delay={i%3*70}><Video v={v} activo={act===v.id} onPlay={()=>setAct(v.id)} onCerrar={()=>setAct(null)}/></Rev>)}</div>;
}

function Historia(){
  const [a,setA]=useState(0);
  return <Pagina ruta="historia">
    <p className="lead">Toca un hito para abrirlo y sigue la historia en los documentales, sin salir del sitio.</p>
    <div className="tl">{HITOS.map((h,k)=><Rev key={h[1]} delay={k*50} className={""}><button className={"hito"+(a===k?" on":"")} onClick={()=>setA(k)} aria-expanded={a===k}><b><em>{h[0]}</em>{h[1]}</b><p>{h[2]}</p></button></Rev>)}</div>

    <h2 className="sub">Lecciones del Apolo 1</h2>
    <p className="suave">El incendio de 1967 en la plataforma de lanzamiento redefinió los materiales, la escotilla y la atmósfera de las cápsulas.</p>
    <VideoGrid lista={V_APOLO1}/>

    <h2 className="sub">Lecciones del Apolo 13</h2>
    <p className="suave">El oxígeno y la energía a bordo quedaron al límite; el control de misión convirtió una avería en un regreso seguro.</p>
    <VideoGrid lista={V_APOLO13}/>

    <h2 className="sub">Canales institucionales</h2>
    <div className="grid canales">{CANALES.map((c,i)=><Rev key={c.n} delay={i*80}><a className="card canal" href={c.u} target="_blank" rel="noreferrer"><h3>{c.n}</h3><p className="suave">{c.d}</p><span className="abrir">youtube.com ↗</span></a></Rev>)}</div>

    <Cruce texto="Mira los datos que usamos hoy para evitar estos casos." to="viento" boton="Ir al Dashboard"/></Pagina>;
}

/* ===== App ===== */
function App(){
  const ruta=useRuta(),[riesgos,setR]=useState(RIESGOS0),[capa,setCapa]=useState(null);
  useEffect(()=>{const f=e=>e.key==="Escape"&&setCapa(null);addEventListener("keydown",f);return()=>removeEventListener("keydown",f)},[]);
  /* Revela los elementos marcados con .rev que no usan el componente Rev */
  useEffect(()=>{
    const els=[...document.querySelectorAll(".rev:not(.vis)")];
    if(!els.length)return;
    if(quieto()||!("IntersectionObserver" in window)){els.forEach(e=>e.classList.add("vis"));return}
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("vis");io.unobserve(e.target)}}),{threshold:.05});
    els.forEach(e=>io.observe(e));
    return()=>io.disconnect();
  },[ruta]);
  let v;
  switch(ruta){
    case "inicio":v=<Inicio/>;break;
    case "intro":v=<Intro/>;break;
    case "riesgos":v=<Riesgos riesgos={riesgos} setR={setR}/>;break;
    case "recomendacion":v=<Recomendacion riesgos={riesgos}/>;break;
    case "prototipos":v=<Prototipos/>;break;
    case "viento":v=<Dash ruta={ruta}><VientoP/></Dash>;break;
    case "oxigeno":v=<Dash ruta={ruta}><OxigenoP/></Dash>;break;
    case "sensores":v=<Dash ruta={ruta}><SensoresP/></Dash>;break;
    case "comparacion":v=<Dash ruta={ruta}><ComparacionP/></Dash>;break;
    case "investigaciones":v=<Dash ruta={ruta}><InvestigacionesP/></Dash>;break;
    case "pruebas":v=<Dash ruta={ruta}><PruebasP/></Dash>;break;
    case "ambiente":v=<Dash ruta={ruta}><AmbienteP/></Dash>;break;
    case "mediciones":v=<Dash ruta={ruta}><MedicionesP/></Dash>;break;
    case "publicaciones":v=<Dash ruta={ruta}><PublicacionesP/></Dash>;break;
    default:v=<Historia/>;
  }
  return <>
    <Progreso/>
    <Cabecera ruta={ruta} menu={()=>setCapa("menu")} buscar={()=>setCapa("buscar")}/>
    <main key={ruta}>{v}</main>
    {capa==="menu"&&<Menu cerrar={()=>setCapa(null)}/>}
    {capa==="buscar"&&<Buscar cerrar={()=>setCapa(null)}/>}
  </>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
