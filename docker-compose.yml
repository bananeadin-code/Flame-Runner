name: flame-runner

services:
  ollama:
    image: ollama/ollama:0.40.16
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  model:
    image: ollama/ollama:0.40.16
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-gemma4:e4b}"]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      ollama:
        condition: service_started
    environment:
      CHAT_PROVIDER: ${CHAT_PROVIDER:-local}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://ollama:11434/v1}
      LOCAL_LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}
      LOCAL_LLM_TIMEOUT: ${LOCAL_LLM_TIMEOUT:-180}
      LOCAL_LLM_MAX_TOKENS: ${LOCAL_LLM_MAX_TOKENS:-4000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODEL_CHAT: ${MODEL_CHAT:-claude-haiku-5-5}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      DB_URL: ${DB_URL:-https://github.com/bananeadin-code/Flame-Runner/releases/download/db-v2/flame.db}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  ollama:
  data:
